variables:
    IMAGE_NAME: krisztiszathmary/circles_app_repository
    IMAGE_TAG: java-app-1.0

run_tests:
  image: maven:3.9.9-amazoncorretto-17
  script:
    - mvn test

build_image:
  image: docker:20.10.16
  before_script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS
  script:
    - docker push $IMAGE_NAME:$IMAGE_TAG